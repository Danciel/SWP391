services:
  postgres:
    image: postgres:16-alpine
    container_name: legacyvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legacyvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5432:5432"
    volumes:
      - legacyvault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legacyvault"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  legacyvault_pgdata:
